name: Sync Codeforces Solutions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check Codeforces secret
        shell: bash
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
        run: |
          if [ -z "$CF_HANDLE" ]; then
            echo "CF_HANDLE secret is not configured. Skipping sync."
            exit 0
          fi

      - name: Run sync script
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_cf_to_github.py

      - name: Commit and push if there are changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync new accepted Codeforces solutions"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No changes to commit."
          fi
